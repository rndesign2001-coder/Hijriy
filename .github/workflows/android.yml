name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Imzolash kaliti (secret)
        env:
          KS_B64: ${{ secrets.HIJRIY_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.HIJRIY_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.HIJRIY_KEY_ALIAS }}
        run: |
          mkdir -p /tmp/logs
          R=/tmp/logs/keystore.txt
          if [ -z "$KS_B64" ]; then
            echo "HIJRIY_KEYSTORE_B64 yo'q — debug kalit" | tee $R
            echo "::warning::HIJRIY_KEYSTORE_B64 secret yo'q — APK vaqtinchalik debug kalit bilan imzolanadi"
            exit 0
          fi
          KS="$RUNNER_TEMP/hijriy.jks"
          printf '%s' "$KS_B64" | tr -d ' \r\n\t' | base64 -d > "$KS" 2>/dev/null || true
          echo "b64 uzunligi: ${#KS_B64}, jks hajmi: $(stat -c %s "$KS")" | tee $R
          [ -n "$KS_PASS" ] && echo "parol bor (${#KS_PASS} belgi)" | tee -a $R || echo "PAROL SECRET YO'Q" | tee -a $R
          if keytool -list -keystore "$KS" -storepass "$KS_PASS" > /tmp/kl.txt 2>&1; then
            A="${KS_ALIAS:-$(grep -m1 -E 'PrivateKeyEntry' /tmp/kl.txt | cut -d, -f1)}"
            echo "alias: $A" | tee -a $R
            keytool -list -v -keystore "$KS" -storepass "$KS_PASS" -alias "$A" | grep -E "SHA256|Owner" | tee -a $R
            echo "HIJRIY_KEYSTORE=$KS" >> "$GITHUB_ENV"
            echo "HIJRIY_KEY_ALIAS=$A" >> "$GITHUB_ENV"
            echo "Doimiy kalit bilan imzolanadi" | tee -a $R
          else
            cat /tmp/kl.txt | tee -a $R
            echo "::error::Kalit ochilmadi (base64 yoki parol noto'g'ri) — debug kalit ishlatiladi"
          fi

      - name: Testlar va APK
        env:
          HIJRIY_KEYSTORE_PASSWORD: ${{ secrets.HIJRIY_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --continue testDebugUnitTest assembleRelease bundleRelease 2>&1 | tee build.log

      - name: Skrinshotlar (ci-shots shoxchasi)
        if: always()
        run: |
          if [ -d app/build/shots ] && [ -n "$(ls app/build/shots)" ]; then
            URL=$(git remote get-url origin)
            AUTH=$(git config --get http.https://github.com/.extraheader || true)
            cd app/build/shots
            git init -q -b ci-shots
            git config user.name "ci-bot"
            git config user.email "ci-bot@users.noreply.github.com"
            git add -A
            git commit -qm "shots ${{ github.run_number }}"
            git -c http.https://github.com/.extraheader="$AUTH" push -f "$URL" ci-shots
          fi

      - name: APK nomini tayyorlash
        id: apk
        run: |
          V="1.0.${{ github.run_number }}"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Hijriy-Taqvim-v$V.apk"
          cp app/build/outputs/bundle/release/app-release.aab "out/Hijriy-Taqvim-v$V.aab"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Hijriy-Taqvim-v${{ steps.apk.outputs.version }}
          path: out/*

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: Hijriy Taqvim v${{ steps.apk.outputs.version }}
          body: |
            Avtomatik yig'ilgan APK (telefonga o'rnatish uchun) va AAB (Google Play'ga yuklash uchun).
            Commit: ${{ github.sha }}
          files: |
            out/*.apk
            out/*.aab
          make_latest: true

      - name: Xato logini saqlash (ci-logs shoxchasi)
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p /tmp/logs
          SIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | tail -1); for a in out/*.apk; do $SIGNER verify --print-certs "$a" >> /tmp/logs/keystore.txt 2>&1 || true; done
          for b in out/*.aab; do echo "AAB: $b" >> /tmp/logs/keystore.txt; keytool -printcert -jarfile "$b" 2>&1 | grep -E "Owner|SHA256" >> /tmp/logs/keystore.txt || true; done
          cp build.log /tmp/logs/build.log 2>/dev/null || echo "build.log yo'q" > /tmp/logs/build.log
          grep -E "^e: |error:|FAILED|What went wrong|Exception|expected:<" -A3 /tmp/logs/build.log | head -400 > /tmp/logs/errors.txt || true
          tail -150 /tmp/logs/build.log > /tmp/logs/tail.txt
          find app/build/test-results -name '*.xml' -exec cp {} /tmp/logs/ \; 2>/dev/null || true
          find app/build/reports/tests -name '*.html' | head -50 | xargs -I{} cp {} /tmp/logs/ 2>/dev/null || true
          echo "${{ github.sha }}" > /tmp/logs/SHA.txt
          URL=$(git remote get-url origin)
          AUTH=$(git config --get http.https://github.com/.extraheader || true)
          cd /tmp/logs
          git init -q -b ci-logs
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A
          git commit -qm "CI log ${{ github.run_number }}"
          git -c http.https://github.com/.extraheader="$AUTH" push -f "$URL" ci-logs
